name: Cache Bust on Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'style.css'
      - 'settings.css'
      - 'app.js'
      - 'settings_addon.js'
      - 'index.html'

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject cache bust timestamp
        run: |
          TIMESTAMP=$(date +%s)
          sed -i "s/__CACHEBUST__/$TIMESTAMP/g" index.html

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto cache bust: $TIMESTAMP"
          git push
          
